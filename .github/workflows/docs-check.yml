name: Documentation Governance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation updates
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          DOCS_BASE_REF: ${{ github.event_name == 'push' && 'HEAD^' || '' }}
        run: python scripts/check_docs_changes.py
