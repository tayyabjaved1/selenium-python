name: Behave Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests (data layer, no browser)
        run: pytest
      - uses: browser-actions/setup-chrome@v1
      - name: Run BDD suite against demoqa.com
        run: behave -f allure_behave.formatter:AllureFormatter -o allure-results
        env:
          HEADLESS: "true"
      - uses: actions/setup-java@v5
        if: always()
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Allure report
        # Not a GitHub Action (a composite Docker action building an image
        # pinned to openjdk:8-jre-alpine, which Docker Hub has since
        # removed, aborted the whole job before any other step ran -- GitHub
        # Actions builds Docker actions used anywhere in the job up front).
        # Installing the CLI directly avoids depending on that image at all.
        if: always()
        run: |
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz -o allure.tgz
          tar -xzf allure.tgz
          ./allure-2.32.0/bin/allure generate allure-results -o allure-report --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
